<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crustGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Rounded Square Golden Amber Background -->
  <rect x="20" y="20" width="460" height="460" rx="110" fill="url(#amberGrad)" />
  <rect x="36" y="36" width="428" height="428" rx="96" fill="none" stroke="#FEF3C7" stroke-width="6" stroke-opacity="0.35" />

  <!-- Savory Steam Lines -->
  <g stroke="#FEF3C7" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 175 130 C 165 105, 190 90, 180 65" />
    <path d="M 250 115 C 240 90, 265 75, 255 50" />
    <path d="M 325 130 C 315 105, 340 90, 330 65" />
  </g>

  <!-- Main Artisan Crispy Risol Roll (Diagonal Golden Cylinder) -->
  <g transform="translate(250, 245) rotate(-18) translate(-165, -75)">
    <!-- Risol Outer Crispy Crust -->
    <rect x="0" y="0" width="330" height="150" rx="75" fill="#FFFFFF" />
    <rect x="10" y="10" width="310" height="130" rx="65" fill="url(#crustGrad)" stroke="#78350F" stroke-width="10" />

    <!-- Creamy Mayo & Cheese Swirl Cut End -->
    <ellipse cx="265" cy="75" rx="32" ry="52" fill="#FFFBEB" stroke="#78350F" stroke-width="8" />
    <path d="M 258 55 C 276 55, 278 95, 258 95 C 245 95, 248 65, 262 65" fill="none" stroke="#D97706" stroke-width="8" stroke-linecap="round" />

    <!-- Crispy Breadcrumb Diagonal Markings -->
    <g stroke="#78350F" stroke-width="9" stroke-linecap="round">
      <line x1="65" y1="38" x2="85" y2="112" />
      <line x1="125" y1="38" x2="145" y2="112" />
      <line x1="185" y1="38" x2="205" y2="112" />
    </g>

    <!-- Crispy Flake Dots -->
    <circle cx="42" cy="75" r="6" fill="#78350F" />
    <circle cx="105" cy="52" r="5" fill="#78350F" />
    <circle cx="165" cy="98" r="5" fill="#78350F" />
  </g>

  <!-- Brand Typography: RisoLogy -->
  <text x="250" y="428" text-anchor="middle" fill="#FFFFFF" font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" font-size="64" letter-spacing="2">
    RisoLogy
  </text>
</svg>